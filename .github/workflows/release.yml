name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build release artifacts
        run: npm run build
      - run: npm test
      - run: npm run coverage
      - run: npm run lint
      - name: Verify tag matches manifest
        run: node -e "const m=require('./manifest.json'); if(process.env.GITHUB_REF_NAME !== 'v'+m.version) process.exit(1)"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --generate-notes
